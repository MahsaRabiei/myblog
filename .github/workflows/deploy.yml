    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 138.197.86.99
          username: erfan
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd myblog
            git pull
            bundle exec jekyll build
